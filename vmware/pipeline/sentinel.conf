input {
    pipeline {
        address => "sentinel"
    }
}

filter {

    # STAGE 1 - Cheap allow-list pre-drop. No grok, no field access beyond  [message] ~99% of the vpxd stream dies here.

    if [message] !~ /(?:UserLoginSessionEvent|BadUsernameSessionEvent|NoAccessUserEvent|VmCreatedEvent|VmBeingCreatedEvent|VmDeployedEvent|VmBeingDeployedEvent|VmClonedEvent|VmBeingClonedEvent|VmRegisteredEvent|VmReconfiguredEvent|VmRemovedEvent|VmAcquiredTicketEvent|VmAcquiredMksTicketEvent|AccountCreatedEvent|AccountUpdatedEvent|AccountRemovedEvent|VimAccountPasswordChangedEvent|PermissionAddedEvent|PermissionUpdatedEvent|PermissionRemovedEvent|RoleAddedEvent|RoleUpdatedEvent|RoleRemovedEvent|com\.vmware\.sso\.PrincipalManagement|com\.vmware\.sso\.LoginSuccess|com\.vmware\.sso\.LoginFailure|com\.vmware\.sso\.IdentitySourceManagement|com\.vmware\.cis\.CreateGlobalPermission|com\.vmware\.cis\.RemoveGlobalPermission)/ {
        drop {
        }
    }


    # STAGE 2 - Parse the vpxd event payload.

    grok {
        match => {
            "message" => [
            "Event \[%{NUMBER:[vcenter][event_key]:int}\] \[%{DATA:[vcenter][chain_id]}\] \[%{TIMESTAMP_ISO8601:[vcenter][event_time]}\] \[%{DATA:[vcenter][event_type]}\] \[%{WORD:[vcenter][severity]}\] \[%{DATA:[vcenter][user]}\] \[%{DATA:[vcenter][target]}\] \[%{NUMBER:[vcenter][chain_key]:int}\] \[%{GREEDYDATA:[vcenter][event_message]}\]"
            ]
        }
        tag_on_failure => [ "_vcenter_event_grokfailure" ]
    }

    # Fallback: pull the bare event type out of non-standard / SSO audit lines.
    if "_vcenter_event_grokfailure" in [tags] {
        grok {
            match => {
                "message" => [
                "(?<[vcenter][event_type]>(?:vim\.event\.|com\.vmware\.(?:sso|cis)\.)[A-Za-z0-9.]+)"
                ]
            }
            tag_on_failure => [ "_vcenter_type_grokfailure" ]
        }
        # Matched Stage 1 but yielded no parseable event type -> substring
        # collision inside an unrelated message body. Bin it.
        if "_vcenter_type_grokfailure" in [tags] {
            drop {
            }
        }
        mutate {
            remove_tag => [ "_vcenter_event_grokfailure" ]
        }
    }

    # STAGE 3 - Strip the namespace prefix for clean classification.
    mutate {
        copy => {
            "[vcenter][event_type]" => "[vcenter][event_short]"
        }
    }
    mutate {
        gsub => [ "[vcenter][event_short]", "^vim\.event\.", "" ]
    }

    # STAGE 4 - Exact-match allow-list. Stage 1 is a substring match and WILL produce false positives; `exact => true` here enforces typing.

    translate {
        source => "[vcenter][event_short]"
        target => "[event][category]"
        fallback => "__UNMATCHED__"
        exact => true
        dictionary => {
            "UserLoginSessionEvent" => "authentication"
            "BadUsernameSessionEvent" => "authentication"
            "NoAccessUserEvent" => "authentication"
            "com.vmware.sso.LoginSuccess" => "authentication"
            "com.vmware.sso.LoginFailure" => "authentication"
            "VmCreatedEvent" => "vm_create"
            "VmBeingCreatedEvent" => "vm_create"
            "VmDeployedEvent" => "vm_create"
            "VmBeingDeployedEvent" => "vm_create"
            "VmClonedEvent" => "vm_create"
            "VmBeingClonedEvent" => "vm_create"
            "VmRegisteredEvent" => "vm_create"
            "VmReconfiguredEvent" => "vm_modify"
            "VmRemovedEvent" => "vm_delete"
            "VmAcquiredTicketEvent" => "vm_console"
            "VmAcquiredMksTicketEvent" => "vm_console"
            "AccountCreatedEvent" => "account_management"
            "AccountUpdatedEvent" => "account_management"
            "AccountRemovedEvent" => "account_management"
            "VimAccountPasswordChangedEvent" => "account_management"
            "com.vmware.sso.PrincipalManagement" => "account_management"
            "PermissionAddedEvent" => "security_config"
            "PermissionUpdatedEvent" => "security_config"
            "PermissionRemovedEvent" => "security_config"
            "RoleAddedEvent" => "security_config"
            "RoleUpdatedEvent" => "security_config"
            "RoleRemovedEvent" => "security_config"
            "com.vmware.sso.IdentitySourceManagement" => "security_config"
            "com.vmware.cis.CreateGlobalPermission" => "security_config"
            "com.vmware.cis.RemoveGlobalPermission" => "security_config"
        }
    }

    if [event][category] == "__UNMATCHED__" {
        drop {
        }
    }

    # STAGE 5 - Outcome + action normalisation (ECS-aligned).
    if [event][category] == "authentication" {
        if [vcenter][event_short] in [ "BadUsernameSessionEvent", "NoAccessUserEvent", "com.vmware.sso.LoginFailure" ] {
            mutate {
                add_field => {
                    "[event][outcome]" => "failure"
                }
            }
        }
        else {
            mutate {
                add_field => {
                    "[event][outcome]" => "success"
                }
            }
        }
        # Client IP from e.g. "Cannot login user@domain@10.0.0.1"
        grok {
            match => {
                "[vcenter][event_message]" => "@(?<[source][ip]>%{IP})"
            }
            tag_on_failure => [ ]
        }
    }

    if [event][category] == "vm_console" {
        grok {
            match => {
                "[vcenter][event_message]" => "(?i)ticket.{0,20}\b(?<[vcenter][ticket_type]>webmks|mks|device|guestControl|dnd)\b"
            }
            tag_on_failure => [ ]
        }
        # if [vcenter][ticket_type] and [vcenter][ticket_type] !~ /^(?i:(web)?mks)$/ {
        #   drop { }
        # }
    }

    mutate {
        add_field => {
            "[event][kind]" => "event"
            "[event][module]" => "vcenter"
            "[event][action]" => "%{[vcenter][event_short]}"
            "[event][provider]" => "vpxd"
        }
    }

    if [vcenter][user] and [vcenter][user] != "" {
        mutate {
            copy => {
                "[vcenter][user]" => "[user][name]"
            }
        }
    }

    date {
        match => [ "[vcenter][event_time]", "ISO8601" ]
        target => "@timestamp"
        tag_on_failure => [ "_vcenter_dateparsefailure" ]
    }

    mutate {
        remove_field => [ "[vcenter][chain_id]", "[vcenter][chain_key]", "[vcenter][event_time]" ]
    }
    mutate {
        add_tag => [ "<environment_name>" ]
    }
}

output {
    microsoft-logstash-output-azure-loganalytics {
        workspace_id => "<workspaceID>"
        workspace_key => "<workspaceKey>"
        custom_log_table_name => "vmware"
    }
}
